name: 每日抓取游戏资讯

on:
  schedule:
    - cron: "0 1 * * *" # UTC 01:00 ≈ 北京时间 09:00
  workflow_dispatch: # 允许手动触发
  push: # 抓取脚本/模板/工作流变更时立即验证一次(机器人只提交网页/数据/RSS, 不会触发, 无循环)
    branches: [main]
    paths:
      - fetch_news.js
      - template.html
      - .github/workflows/daily.yml

permissions:
  contents: write
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 抓取资讯并生成网页
        run: node fetch_news.js

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/news.json feed.xml
          if git diff --cached --quiet; then
            echo "无变化, 跳过提交"
          else
            git commit -m "chore: 每日资讯更新 $(date -u +%Y-%m-%d)"
            git push
          fi

  # 定时任务失败时自动创建/追加告警 Issue, 避免像 2026-08 这样静默失效无人察觉
  notify-failure:
    needs: fetch
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: 自动提 Issue 告警
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="每日资讯抓取失败告警"
          NOW="$(date -u '+%Y-%m-%d %H:%M UTC')"
          BODY="定时任务于 $NOW 运行失败, 请到 [Actions 页面](${{ github.server_url }}/${{ github.repository }}/actions) 查看失败日志定位原因。恢复正常后请关闭本 Issue。"
          NUM="$(gh issue list --state open --search "每日资讯抓取失败 in:title" --json number --jq '.[0].number' || true)"
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "再次失败: $NOW"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
